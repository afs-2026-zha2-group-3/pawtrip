spring:
  application:
    name: pawtrip-server
  datasource:
    url: jdbc:sqlite:data/pawtrip.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: false

amap:
  api-key: ${AMAP_API_KEY:}
  base-url: https://restapi.amap.com
  connect-timeout: 2s
  read-timeout: 5s
