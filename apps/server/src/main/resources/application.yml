spring:
  application:
    name: pawtrip-server
  datasource:
    url: jdbc:sqlite:data/pawtrip.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
