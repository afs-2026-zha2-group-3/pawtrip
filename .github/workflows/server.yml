name: Server CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: apps/server/pom.xml
      - name: Run tests
        working-directory: apps/server
        run: ./mvnw -B test
